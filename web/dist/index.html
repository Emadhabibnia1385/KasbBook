    <!-- Picks light or dark before the first paint so neither theme flashes the other: the saved
         choice, else the device. The theme controller (nasim ThemeProvider) takes over after. -->

      (function () {
        try {
          var saved = localStorage.getItem("nasim-theme");
          var scheme = saved === "light" || saved === "dark" ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.classList.add(scheme);
          document.documentElement.dataset.theme = scheme;
        } catch (e) {}
      })();
    </script>
