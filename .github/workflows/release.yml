# Publishes a GitHub release when a version tag is pushed, with the notes taken from CHANGELOG.md.
#
#   git tag -a v1.5.0 -m "KasbBook 1.5.0" && git push origin v1.5.0
#
# It also runs by hand for a tag that already exists (Actions → release → Run workflow).

name: release

on:
  push:
    tags: ["v*"]
    # A change to the changelog on main publishes the release of its newest version, if that version is
    # tagged and has no release yet: tagging first and writing the notes after still ends in a release.
    branches: [main]
    paths: [CHANGELOG.md, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag, for example v1.5.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then TAG="$REF_NAME"
          else TAG="v$(grep -m1 -oP '^## \K[0-9][^ ]*' CHANGELOG.md)"; fi
          echo "version: $TAG"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "no tag $TAG yet; nothing to publish"; exit 0; }
          # The notes come from the checked-out branch (its changelog and script), the release points at the tag.
          python3 scripts/release_notes.py "$TAG" > /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "KasbBook ${TAG#v}" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --verify-tag --title "KasbBook ${TAG#v}" --notes-file /tmp/notes.md --latest
          fi
