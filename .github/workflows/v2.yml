name: v2

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2, main]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v2.txt -r requirements-dev.txt pytest pytest-asyncio

      - name: Lint
        run: python -m pyflakes src/kasbbook apps tests/v2

      - name: Tests
        run: python -m pytest tests/v2 -q

  postgres:
    name: migrations on postgres
    runs-on: ubuntu-latest

    # The blind spot this job exists to close: an ALTER that only fails against
    # a populated PostgreSQL table reached production three deploys running,
    # because the suite only ever rehearsed on SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kasbbook
          POSTGRES_PASSWORD: kasbbook
          POSTGRES_DB: kasbbook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kasbbook"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v2.txt -r requirements-dev.txt pytest pytest-asyncio

      - name: Rehearse every migration against populated tables
        env:
          KASBBOOK_TEST_POSTGRES_URL: postgresql+asyncpg://kasbbook:kasbbook@localhost:5432/kasbbook_test
        run: python -m pytest tests/v2/test_migrations_postgres.py -q

  legacy:
    name: first generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The old bot still exists on this branch and still has to pass, until
      # the day it is removed on purpose rather than by accident.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke test
        run: python tests/smoke_test.py
