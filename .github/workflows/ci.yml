name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m pyflakes src/kasbbook apps tests

      - name: Tests
        run: python -m pytest tests -q

  postgres:
    name: migrations on postgres
    runs-on: ubuntu-latest

    # The blind spot this job exists to close: an ALTER that only fails against
    # a populated PostgreSQL table reached production three deploys running,
    # because the suite only ever rehearsed on SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kasbbook
          POSTGRES_PASSWORD: kasbbook
          POSTGRES_DB: kasbbook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kasbbook"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rehearse every migration against populated tables
        env:
          KASBBOOK_TEST_POSTGRES_URL: postgresql+asyncpg://kasbbook:kasbbook@localhost:5432/kasbbook_test
        run: python -m pytest tests/test_migrations_postgres.py -q

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script
        run: for f in scripts/*.sh; do bash -n "$f"; done
