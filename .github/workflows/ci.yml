name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The runner image is named, not `ubuntu-latest`: that label moves to a new
# Ubuntu on GitHub's schedule, and a CI environment changing underneath the
# suite is a change nobody reviewed. Move it on purpose, in its own commit.
jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m pyflakes src/kasbbook apps tests

      - name: Tests
        run: python -m pytest tests -q

  postgres:
    name: migrations on postgres
    runs-on: ubuntu-24.04

    # The blind spot this job exists to close: an ALTER that only fails against
    # a populated PostgreSQL table reached production three deploys running,
    # because the suite only ever rehearsed on SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kasbbook
          POSTGRES_PASSWORD: kasbbook
          POSTGRES_DB: kasbbook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kasbbook"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rehearse every migration against populated tables
        env:
          KASBBOOK_TEST_POSTGRES_URL: postgresql+asyncpg://kasbbook:kasbbook@localhost:5432/kasbbook_test
        # A rehearsal that skipped is a rehearsal that did not run, and this job
        # exists for nothing else. `shell: bash` adds pipefail, so a failing
        # pytest still fails the step through the tee.
        shell: bash
        run: |
          python -m pytest tests/test_migrations_postgres.py -q -rs | tee rehearsal.log
          ! grep -qiE "[0-9]+ skipped" rehearsal.log

  services:
    name: races on real redis and postgres
    runs-on: ubuntu-24.04

    # SQLite is single-writer and the in-memory state store runs on one event
    # loop, so the main job can only show that the code means to be safe when
    # two workers race. This one makes them race: a double tap claiming one
    # draft, and two messengers' reminder loops booking the same recurring date.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kasbbook
          POSTGRES_PASSWORD: kasbbook
          POSTGRES_DB: kasbbook_race
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kasbbook"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Race the real services
        env:
          KASBBOOK_TEST_POSTGRES_URL: postgresql+asyncpg://kasbbook:kasbbook@localhost:5432/kasbbook_race
          KASBBOOK_TEST_REDIS_URL: redis://localhost:6379/15
        # A race that skipped did not run. -rs names any skip, and the grep turns
        # one into a failed job rather than a green tick over nothing.
        shell: bash
        run: |
          python -m pytest tests/test_concurrency_services.py -q -rs | tee races.log
          ! grep -qiE "[0-9]+ skipped" races.log

  scripts:
    name: shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Parse every script
        run: for f in scripts/*.sh; do bash -n "$f"; done
