# The documentation site, built from the same markdown the repository shows on
# GitHub. One source: a page cannot be right in one place and stale in the
# other, which is the failure mode of every docs site kept beside a codebase.

site_name: KasbBook
site_description: Bookkeeping for a small business, wherever that business already talks
site_url: https://emadhabibnia1385.github.io/KasbBook/
repo_url: https://github.com/Emadhabibnia1385/KasbBook
repo_name: Emadhabibnia1385/KasbBook
edit_uri: edit/main/docs/
copyright: MIT

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    # `navigation.instant` is deliberately absent: it is incompatible with the
    # language switcher's contextual link, and switching language should land
    # on the same page in the other language rather than on its home page.
    # A slightly slower page load is worth much less than that.
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    # The reader's own preference first, then a switch either way. `custom`
    # hands the colours to assets/theme.css instead of a Material preset.
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Follow the system }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light }

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Understanding it:
      - Architecture: architecture.md
      - Data model: data-model.md
      - Double-entry: double-entry.md
      - Payroll & treasury: payroll.md
      - Providers: providers.md
  - Using it:
      - The API: api.md
      - Configuration: configuration.md
  - Running it:
      - Operations: operations.md
      - Security: security.md
      - Troubleshooting: troubleshooting.md
  - Contributing:
      - Development: development.md
      - Roadmap: roadmap.md

extra_css:
  - assets/theme.css

extra_javascript:
  - assets/language.js

markdown_extensions:
  - def_list
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }

plugins:
  # `search` has to come after i18n so it indexes both languages.
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true

        - locale: fa
          name: فارسی
          build: true
          site_name: کسب‌بوک
          site_description: دفترداری کسب‌وکار کوچک، همان‌جا که کسب‌وکار حرف می‌زند
          # Material knows Persian reads right to left and flips the whole
          # layout — sidebar, table of contents, code gutters — from the
          # language alone. Setting `direction` as well is rejected as an
          # unknown override, and was doing nothing.
          theme:
            language: fa
          nav_translations:
            Home: خانه
            Getting started: شروع
            Understanding it: درک آن
            Architecture: معماری
            Data model: مدل داده
            Double-entry: دفتر دوطرفه
            Payroll & treasury: حقوق و خزانه
            Providers: پیام‌رسان‌ها
            Using it: استفاده
            The API: رابط برنامه‌نویسی
            Configuration: پیکربندی
            Running it: اجرا
            Operations: عملیات
            Security: امنیت
            Troubleshooting: عیب‌یابی
            Contributing: مشارکت
            Development: توسعه
            Roadmap: نقشهٔ راه
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Emadhabibnia1385/KasbBook
    - icon: fontawesome/solid/book
      link: https://kasbbook.nyxon.tech/docs
      name: Live API reference

# A broken link in the docs should fail the build, not wait to be found by a
# reader. The nav is the only thing allowed to reference a file that moved.
strict: true
